apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmc-south
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: vmc-south
    app.kubernetes.io/component: detector
    app.kubernetes.io/part-of: cloudforge
    platform.cloudforge.io/domain: vmc
    voiceshield.io/vm: VM2_SOUTH
    voiceshield.io/group: SOUTH
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmc-south
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmc-south
        app.kubernetes.io/component: detector
        app.kubernetes.io/part-of: cloudforge
        platform.cloudforge.io/domain: vmc
        voiceshield.io/vm: VM2_SOUTH
        voiceshield.io/group: SOUTH
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "51052"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        workload: ml
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: vmc-south
          image: cloudforge/vmc-south:v1.0.0-scaffold
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: metrics
              containerPort: 51052
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
