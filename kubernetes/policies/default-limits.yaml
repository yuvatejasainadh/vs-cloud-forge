---
apiVersion: v1
kind: LimitRange
metadata:
  name: ml-platform-default-limits
  namespace: ml-platform
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      default:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "100m"
        memory: "128Mi"