name: CloudForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-go:
    name: Validate Go Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/cloudforge-reference/go.sum

      - name: Check Go Formatting
        working-directory: services/cloudforge-reference
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Unit & Integration Tests
        working-directory: services/cloudforge-reference
        run: go test -v -race ./...

      - name: Build Go Binaries
        working-directory: services/cloudforge-reference
        run: |
          go build -v ./cmd/server
          go build -v ./cmd/client

  validate-docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: services/cloudforge-reference
          file: services/cloudforge-reference/Dockerfile
          push: false
          tags: cloudforge/cloudforge-reference:ci-test

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize & Kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Workload Kustomization
        run: |
          kubectl kustomize kubernetes/workloads/cloudforge-reference
          kubectl apply --dry-run=client -k kubernetes/workloads/cloudforge-reference

      - name: Validate Policy and Namespace Manifests
        run: |
          kubectl apply --dry-run=client -f kubernetes/namespaces/cloudforge-system.yaml
          kubectl apply --dry-run=client -f kubernetes/policies/default-limits.yaml
